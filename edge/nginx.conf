# Edge del clúster Swarm (EP3, IE12)
# API Gateway → http://<IP del manager>/<servicio>/<ruta> → este nginx → ms-<servicio>:<puerto>/<ruta>
# Rechaza con 403 todo lo que no traiga la cabecera secreta que agrega el API Gateway, así el
# backend no se puede usar saltándose la API key, el throttling ni la cuota del gateway.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    default_type application/json;
    client_max_body_size 1m;

    # Traza: el API Gateway envía su requestId en X-Request-Id
    log_format principal '$remote_addr "$request" $status $body_bytes_sent ${request_time}s '
                         'servicio=$servicio origen_valido=$origen_valido request_id=$http_x_request_id';
    access_log /dev/stdout principal;
    error_log /dev/stderr warn;

    # DNS interno de Docker: resuelve ms-agenda, ms-pagos... a la IP virtual (VIP) del servicio,
    # que balancea entre todas sus réplicas. valid=10s para seguir los cambios del clúster.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Define:  map $http_x_origin_verify $origen_valido { default 0; "<secreto>" 1; }
    # Viene de un secreto de Docker Swarm (rys_origin_secret_map), no del repositorio.
    map_hash_bucket_size 128;          # el secreto (48 caracteres) no cabe en el tamaño por defecto
    include /run/secrets/origen.conf;

    map $servicio $puerto {
        default        0;
        identidad      8081;
        psicologos     8082;
        agenda         8083;
        talleres       8084;
        pagos          8085;
        clinico        8086;
        notificaciones 8087;
    }

    server {
        listen 80;
        set $servicio "-";

        # Salud del edge (la usan el HEALTHCHECK de Docker y las pruebas de humo)
        location = /salud {
            access_log off;
            return 200 '{"estado":"UP","componente":"edge"}';
        }

        location ~ ^/(identidad|psicologos|agenda|talleres|pagos|clinico|notificaciones)(/.*)?$ {
            set $servicio $1;
            set $ruta $2;
            if ($origen_valido = 0) {
                return 403 '{"status":403,"error":"Forbidden","mensaje":"Acceso directo no permitido: use el API Gateway"}';
            }
            if ($ruta = "") {
                set $ruta "/";
            }
            proxy_pass http://ms-$servicio:$puerto$ruta$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Origin-Verify "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            # Si una réplica está reiniciando, reintenta en otra
            proxy_next_upstream error timeout http_502 http_503;
        }

        location / {
            return 404 '{"status":404,"error":"Not Found","mensaje":"Ruta desconocida. Servicios: identidad, psicologos, agenda, talleres, pagos, clinico, notificaciones"}';
        }
    }
}
